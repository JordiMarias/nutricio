name: CI & Multi-Platform Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: nutricio-linux-x86_64-static
            binary_path: target/x86_64-unknown-linux-musl/release/nutricio

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: nutricio-windows-x86_64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/nutricio.exe

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: nutricio-linux-aarch64-static
            binary_path: target/aarch64-unknown-linux-musl/release/nutricio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux & ARM64 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config

      - name: Configure Linker for Linux ARM64 MUSL
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Tests (x86_64 Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist_bins
          cp ${{ matrix.binary_path }} dist_bins/${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist_bins/${{ matrix.asset_name }}

  release:
    name: Create Multi-Platform GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
