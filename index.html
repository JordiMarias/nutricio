<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="utf-8">
    <title>Aplicació de control nutricional</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="Calculadora nutricional, planificador de menús diaris/setmanals, control de despesa alimentària i classificació NOVA.">
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            touch-action: pan-x pan-y;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        #centered-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4CAF50;
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div id="centered-loader">Carregant l'aplicació de nutrició...</div>
</body>
</html>
