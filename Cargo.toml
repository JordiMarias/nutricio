[package]
name = "NutritionalPlanner"
version = "0.1.5"
edition = "2021"
authors = ["Jordi Marias-i-Parella"]
license = "MIT"
description = "A comprehensive, cross-platform nutritional calculator, food expenditure planner, and NOVA food classification app written in Rust using egui / eframe. It compiles seamlessly to native desktop executables (Linux, Windows, macOS) and WebAssembly (WASM) for web deployment."


[dependencies]
egui = "0.29"
eframe = { version = "0.29", features = ["default", "glow", "wgpu", "persistence"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"

# Web dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Storage", "Location"] }
console_error_panic_hook = "0.1"
reqwest = { version = "0.12", features = ["json"] }

# Native desktop dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
tokio = { version = "1.0", features = ["full"] }


[lib]
name = "nutricio"
path = "src/lib.rs"

[[bin]]
name = "NutritionalPlanner"
path = "src/main.rs"

[build-dependencies]

