[package]
name = "nutricio"
version = "0.1.0"
edition = "2021"
authors = ["Jordi Mariàs"]
license = "MIT"
description = "Calculadora Nutricional, de Despesa Alimentària i Classificació NOVA en Rust (Desktop + WASM)"


[dependencies]
egui = "0.29"
eframe = { version = "0.29", features = ["default", "glow", "wgpu", "persistence"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"

# Web dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Storage", "Location"] }
console_error_panic_hook = "0.1"
reqwest = { version = "0.12", features = ["json"] }

# Native desktop dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]

